# The Docker image, for x64 and arm64, published to GitHub's container
# registry under this repository's owner, as the image named below.
#
#   tag v1.2.3       -> :1.2.3, :1.2, and :latest
#   tag v1.2.3-rc1   -> :1.2.3-rc1 only; a pre-release never takes :latest
#   pull request     -> built for both platforms, not published
#   manual run       -> built; published only when run on a release tag
#
# Images are published for releases and nothing else, so everything in the
# registry is a version somebody chose to ship. Work on main between releases
# is built for pull requests but never published.
#
# The frontend stage runs on the runner's own platform (the Dockerfile pins it
# to $BUILDPLATFORM), so only the Python stage is emulated for arm64.
name: Docker image

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/bretteroo/eeronaut
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Eeronaut
            org.opencontainers.image.description=Locally-hosted web dashboard for managing eero mesh networks
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
