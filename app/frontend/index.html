<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The active theme's icon, or the program's own when it brings none.
         One fixed href so the browser fetches the right icon first, rather
         than showing the previous one until the theme list arrives. -->
    <link rel="icon" href="/api/themes/active-favicon" />
    <link rel="apple-touch-icon" href="/api/themes/active-favicon" />
    <!-- What a browser needs to offer Eeronaut as an installed app: its name,
         its own window, and the program's icon, whichever theme is worn. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eeronaut</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
