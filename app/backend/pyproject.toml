[project]
name = "eeronaut"
version = "1.0.0"
description = "Web UI for eero mesh networks"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "cryptography>=44.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
# The floors are what the code generated in eeronaut/proto checks for when it
# loads, which the grpcio-tools pinned below decides: 1.84.0 writes code that
# needs grpcio 1.84.0 and protobuf 7.35.1. An older runtime refuses it, and
# local control is then off (clients/local.py logs why), so a floor below these
# installs without complaint and does not work. Raise them with the pin.
local = ["grpcio>=1.84.0", "protobuf>=7.35.1,<8", "zeroconf>=0.136"]

[build-system]
# grpcio-tools compiles eeronaut/proto during the build (hatch_build.py). It
# is installed into the throwaway build environment only.
requires = ["hatchling", "grpcio-tools==1.84.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eeronaut"]
# Generated by the hook and ignored by git, so named here to be packaged.
artifacts = ["eeronaut/proto/**/*_pb2.py", "eeronaut/proto/**/*_pb2_grpc.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
